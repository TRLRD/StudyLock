name: Apply StudyLock UI polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message != 'Apply StudyLock UI polish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply polish
        run: python tools/apply_ui_polish.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet || git commit -m "Apply StudyLock UI polish"
          git push
