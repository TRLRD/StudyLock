name: Apply StudyLock UI polish

# Disabled for automatic development. Run manually only when deliberately applying the old polish patcher.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply runtime fixes
        run: python tools/apply_runtime_fixes.py

      - name: Apply standalone question test path
        run: python tools/apply_question_test.py

      - name: Apply polish
        run: python tools/apply_ui_polish.py

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet || git commit -m "Fix question display and runtime lifecycle"
          git push
