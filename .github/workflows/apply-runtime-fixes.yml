name: Apply Runtime Fixes

# Disabled for automatic development. Run manually only when deliberately applying the legacy runtime patcher.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: python tools/apply_runtime_fixes.py

      - name: Verify syntax
        run: python -m py_compile main.py

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix StudyLock runtime lifecycle and controls [skip ci]'
          git push
